<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; img-src data: blob:; style-src 'unsafe-inline'">
  <title>Jewel Buddy</title>
  <style>
    :root{color-scheme:light dark;--ink:#151515;--muted:#707070;--line:color-mix(in srgb,currentColor 13%,transparent);--panel:color-mix(in srgb,currentColor 4%,transparent);--gold:#b88a35}
    *{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:transparent;font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{padding:18px 20px 16px}.app{max-width:920px;margin:0 auto}.loading{min-height:260px;display:grid;place-content:center;text-align:center;color:var(--muted);gap:12px}.mark{font:700 17px/1 Georgia,serif;color:var(--gold);letter-spacing:.12em}
    header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:15px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.title{font-size:24px;line-height:1.2;margin:4px 0 5px}.intro{color:var(--muted);max-width:680px}.progress{white-space:nowrap;font-size:13px;color:var(--muted);padding-top:5px}.bar{height:3px;background:var(--line);margin-bottom:18px}.bar>i{display:block;height:100%;background:var(--ink);transition:width .2s ease}
    fieldset{border:0;margin:0;padding:0;min-height:190px}legend{font-size:19px;font-weight:700;padding:0;margin-bottom:5px}.help{color:var(--muted);margin-bottom:13px}.required{color:var(--gold);font-size:12px;margin-left:6px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:block;position:relative}.option input{position:absolute;opacity:0;pointer-events:none}.option span{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:52px;background:var(--panel);cursor:pointer;transition:.15s}.option b{display:block;font-size:15px}.option small{display:block;color:var(--muted);margin-top:2px}.option input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}.option input:checked+span{background:var(--ink);color:white;border-color:var(--ink)}.option input:checked+span small{color:#d8d8d8}
    textarea,.other{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:inherit;padding:12px 13px;font:inherit;resize:none;outline:none}.other{margin-top:9px;height:44px}.other:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 18%,transparent)}textarea{height:126px}.error{min-height:21px;color:#b42318;font-size:13px;margin-top:8px}
    footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;padding-top:13px}.actions{display:flex;gap:9px;margin-left:auto}button{border:0;border-radius:999px;padding:10px 17px;font:700 14px/1 inherit;cursor:pointer}.ghost{background:transparent;color:inherit;border:1px solid var(--line)}.primary{background:#111;color:#fff}.primary:disabled{opacity:.42;cursor:not-allowed}.submitted{min-height:250px;display:grid;place-content:center;text-align:center;gap:8px}.submitted h2{margin:0;font-size:22px}.submitted p{margin:0;color:var(--muted)}
    @media(max-width:620px){body{padding:14px}.title{font-size:21px}.options{grid-template-columns:1fr}fieldset{min-height:220px}.progress{font-size:12px}header{gap:8px}}
    @media(prefers-color-scheme:dark){:root{--ink:#f4f4f4;--muted:#aaa;--gold:#d0a54e}.primary{background:#f5f5f5;color:#111}.option input:checked+span{background:#f5f5f5;color:#111}.option input:checked+span small{color:#555}}
  </style>
</head>
<body>
  <main class="app" id="app"><section class="loading" id="loading"><div class="mark">JB</div><div>正在载入访谈问题…</div></section></main>
  <script type="module">
  (()=>{
    "use strict";
    class WorkBuddyBridge{
      constructor({name,version,autoResize=false}){this.name=name;this.version=version;this.autoResize=autoResize;this.seq=1;this.pending=new Map();this.hostContext={};window.addEventListener("message",event=>this.receive(event));}
      send(message){window.parent.postMessage(message,"*")}
      request(method,params){return new Promise((resolve,reject)=>{const id=this.seq++;this.pending.set(id,{resolve,reject});this.send({jsonrpc:"2.0",id,method,params})})}
      notify(method,params){this.send({jsonrpc:"2.0",method,params})}
      updateModelContext(params){return this.request("ui/update-model-context",params)}
      sendMessage(params){return this.request("ui/message",params)}
      receive(event){if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&this.pending.has(message.id)){const pending=this.pending.get(message.id);this.pending.delete(message.id);message.error?pending.reject(new Error(message.error.message)):pending.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")this.ontoolresult?.(message.params);else if(message.method==="ui/notifications/tool-input")this.ontoolinput?.(message.params);else if(message.method==="ui/notifications/host-context-changed"){this.hostContext={...this.hostContext,...message.params};this.onhostcontextchanged?.(this.hostContext)}}
      async connect(){const result=await this.request("ui/initialize",{appInfo:{name:this.name,version:this.version},appCapabilities:{availableDisplayModes:["inline"]},protocolVersion:"2026-01-26"});this.hostContext=result?.hostContext||{};this.notify("ui/notifications/initialized",{});if(this.autoResize){const resize=()=>requestAnimationFrame(()=>this.notify("ui/notifications/size-changed",{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight}));new ResizeObserver(resize).observe(document.body)}return result}
    }
    let active=null,index=0,answers={},otherText={},submitting=false;
    const root=document.getElementById("app");
    const app=new WorkBuddyBridge({name:"jewel-buddy-interview",version:"0.1.0",autoResize:true});
    const parse=(value,depth=0)=>{if(depth>8||value==null)return null;if(typeof value==="string"){try{return parse(JSON.parse(value),depth+1)}catch{return null}}if(Array.isArray(value)){for(const item of value){const found=parse(item,depth+1);if(found)return found}return null}if(typeof value!=="object")return null;if(value.interview?.questions)return value.interview;if(value.structuredContent)return parse(value.structuredContent,depth+1);if(value.result)return parse(value.result,depth+1);if(value.content)return parse(value.content,depth+1);if(value.text)return parse(value.text,depth+1);return null};
    const toolError=(value,depth=0)=>{if(depth>8||value==null)return "";if(typeof value==="string"){try{return toolError(JSON.parse(value),depth+1)}catch{return ""}}if(Array.isArray(value)){for(const item of value){const found=toolError(item,depth+1);if(found)return found}return ""}if(typeof value!=="object")return "";if(value.isError){const message=Array.isArray(value.content)?value.content.find(item=>item?.type==="text")?.text:"";return message||value.error?.message||"表单载入失败。"}for(const key of ["result","structuredContent","content","text"]){const found=toolError(value[key],depth+1);if(found)return found}return ""};
    const terminal=(message)=>{active=null;root.innerHTML=`<section class="loading"><div class="mark">JB</div><div>${escapeHtml(message)}</div></section>`};
    const escapeHtml=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const hasAnswer=(q)=>q.type==="multi"?Array.isArray(answers[q.id])&&answers[q.id].length>0:String(answers[q.id]??"").trim().length>0;
    function optionMarkup(q,o){const checked=q.type==="multi"?(answers[q.id]||[]).includes(o.value):answers[q.id]===o.value;return `<label class="option"><input type="${q.type==="multi"?"checkbox":"radio"}" name="${escapeHtml(q.id)}" value="${escapeHtml(o.value)}" ${checked?"checked":""}><span><b>${escapeHtml(o.label)}</b>${o.description?`<small>${escapeHtml(o.description)}</small>`:""}</span></label>`}
    function render(){if(!active)return;const q=active.questions[index];const selectedOther=q.type==="multi"?(answers[q.id]||[]).includes("other"):answers[q.id]==="other";const roundProgress=active.stage==="confirmation"?"Brief 确认":`探索 ${Math.min(active.round,active.minimumDiscoveryRounds)} / ${active.minimumDiscoveryRounds}`;root.innerHTML=`<header><div><div class="eyebrow">WorkBuddy · ${escapeHtml(active.stageLabel)} · 第 ${active.round} 轮</div><h1 class="title">${escapeHtml(active.title)}</h1>${active.intro?`<div class="intro">${escapeHtml(active.intro)}</div>`:""}</div><div class="progress">${roundProgress}<br>${index+1} / ${active.questions.length}</div></header><div class="bar"><i style="width:${((index+1)/active.questions.length)*100}%"></i></div><fieldset><legend>${escapeHtml(q.label)}${q.required?'<span class="required">必答</span>':""}</legend>${q.help?`<div class="help">${escapeHtml(q.help)}</div>`:""}${q.type==="text"?`<textarea id="textAnswer" maxlength="800" placeholder="${escapeHtml(q.placeholder||"请写下你的想法")}">${escapeHtml(answers[q.id]||"")}</textarea>`:`<div class="options">${q.options.map(o=>optionMarkup(q,o)).join("")}</div>${selectedOther?`<input class="other" id="otherAnswer" maxlength="160" placeholder="请补充具体方向" value="${escapeHtml(otherText[q.id]||"")}">`:""}`}<div class="error" id="error"></div></fieldset><footer><button class="ghost" id="back" ${index===0?"disabled":""}>上一题</button><div class="actions">${index<active.questions.length-1?'<button class="primary" id="next">下一题</button>':`<button class="primary" id="submit">${escapeHtml(active.submitLabel)}</button>`}</div></footer>`;
      bind(q);
    }
    function bind(q){if(q.type==="text")document.getElementById("textAnswer").addEventListener("input",e=>answers[q.id]=e.target.value);else document.querySelectorAll(`input[name="${CSS.escape(q.id)}"]`).forEach(input=>input.addEventListener("change",e=>{if(q.type==="multi"){const set=new Set(answers[q.id]||[]);e.target.checked?set.add(e.target.value):set.delete(e.target.value);answers[q.id]=[...set]}else answers[q.id]=e.target.value;render()}));document.getElementById("otherAnswer")?.addEventListener("input",e=>otherText[q.id]=e.target.value);document.getElementById("back").onclick=()=>{if(index>0){index--;render()}};document.getElementById("next")?.addEventListener("click",()=>{if(validate(q)){index++;render()}});document.getElementById("submit")?.addEventListener("click",()=>{if(validate(q))submit()})}
    function validationMessage(q){if(q.required&&!hasAnswer(q))return "请先完成这一题。";const selected=q.type==="multi"?(answers[q.id]||[]).includes("other"):answers[q.id]==="other";if(selected&&!String(otherText[q.id]||"").trim())return "请补充“其他”的具体内容。";return ""}
    function validate(q){const message=validationMessage(q);document.getElementById("error").textContent=message;return !message}
    const answerLabel=(q)=>{const raw=answers[q.id];if(q.type==="text")return String(raw||"").trim();const values=Array.isArray(raw)?raw:[raw];return values.filter(Boolean).map(v=>v==="other"?`其他：${String(otherText[q.id]||"").trim()}`:(q.options.find(o=>o.value===v)?.label||v)).join("、")};
    async function submit(){
      if(submitting)return;
      const invalid=active.questions.findIndex(q=>validationMessage(q));
      if(invalid>=0){index=invalid;render();document.getElementById("error").textContent=validationMessage(active.questions[invalid]);return}
      submitting=true;
      const submitButton=document.getElementById("submit");
      if(submitButton)submitButton.disabled=true;
      const payload={schemaVersion:2,round:active.round,stage:active.stage,minimumDiscoveryRounds:active.minimumDiscoveryRounds,answers:active.questions.map(q=>({id:q.id,value:answers[q.id]??(q.type==="multi"?[]:""),...(otherText[q.id]?{otherText:otherText[q.id]}:{})}))};
      const summary=active.questions.map(q=>`- ${q.label}：${answerLabel(q)||"未填写"}`).join("\n");
      const nextInstruction=active.stage==="confirmation"
        ?"请读取本轮确认结果：如果 brief 已确认，立即使用 WorkBuddy 当前可用的图片生成能力，按约定数量生成独立珠宝设计图并在主对话中展示；如果用户要求修改，请先修订 brief 并再次确认。"
        :"请保留本轮回答，继续 Jewel Buddy 的下一个未完成阶段，不要重复询问已经确认的事实。";
      const message=`已完成 Jewel Buddy 第 ${active.round} 轮【${active.stageLabel}】。\n${summary}\n${nextInstruction}\nCurrent widget context (JSON): ${JSON.stringify(payload)}`;
      try{
        await app.updateModelContext({
          content:[{type:"text",text:`Jewel Buddy widget 第 ${active.round} 轮已提交。${summary}`}],
          structuredContent:{jewelBuddySubmission:payload},
        }).catch(()=>{});
        const messageResult=await app.sendMessage({
          role:"user",
          content:[{type:"text",text:message}],
          _meta:{"codebuddy.ai/sendMessageMode":"send"},
        });
        if(messageResult?.isError)throw new Error("WorkBuddy rejected ui/message");
        root.innerHTML=`<section class="submitted"><div class="mark">JB</div><h2>已发送到 WorkBuddy</h2><p>${active.stage==="confirmation"?"正在请求主对话确认并生成设计图。":"主对话会保留答案并继续下一阶段。"}</p></section>`;
      }catch(e){
        submitting=false;
        if(submitButton)submitButton.disabled=false;
        document.getElementById("error").textContent="提交到 WorkBuddy 失败，请重试。";
      }
    }
    function accept(value){const candidate=parse(value);if(!candidate)return false;if(!Array.isArray(candidate.questions)||candidate.questions.length<1){terminal("访谈问题不完整，请重新发起。");return true}active=candidate;index=0;answers={};otherText={};submitting=false;render();return true}
    const applyTheme=(theme)=>{if(!theme)return;document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme};
    app.ontoolresult=(result)=>{const message=toolError(result);if(message){terminal(message);return}if(!accept(result))terminal("访谈问题不完整，请重新发起。")};
    app.ontoolinput=(input)=>accept(input?.arguments?.interview??input?.arguments);
    app.onhostcontextchanged=(context)=>applyTheme(context?.theme);
    app.connect().then(()=>applyTheme(app.hostContext?.theme)).catch(()=>terminal("无法连接 WorkBuddy Apps UI，请检查 MCP 配置。"));
    setTimeout(()=>{if(!active)terminal("没有收到访谈问题，请重新调用 Jewel Buddy 表单。")},9000);
  })();
  </script>
</body>
</html>
